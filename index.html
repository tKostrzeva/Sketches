<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8bit_tex — Recursive Texture Rasterizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="canvas-wrap">
  <canvas id="output"></canvas>
  <video id="camera-video" autoplay playsinline muted></video>
  <div id="drop-hint">Upload an image or start the camera<br>then add a texture array &rarr;</div>
</div>

<button id="toggle-btn" aria-label="Toggle controls">&#9776;</button>

<aside id="panel">
  <div class="panel-header">
    <div class="panel-title">8bit_tex v01</div>
    <button id="close-btn" aria-label="Close">&#10005;</button>
  </div>

  <div class="ctrl">
    <div class="ctrl-label">Source</div>
    <div class="btn-row">
      <label class="file-btn" for="img-input">Upload Image</label>
      <input type="file" id="img-input" accept="image/*" hidden>
      <button id="cam-btn" class="ghost-btn">Camera</button>
    </div>
    <button id="freeze-btn" class="ghost-btn hidden">Freeze Frame</button>
  </div>

  <div class="divider"></div>

  <div class="ctrl">
    <div class="ctrl-label">Texture Array <span class="val" id="tex-count">0 imgs</span></div>
    <label class="file-btn" for="tex-input">Upload Images</label>
    <input type="file" id="tex-input" accept="image/*" multiple hidden>
    <div id="tex-strip"></div>
  </div>

  <div class="divider"></div>

  <div class="ctrl">
    <div class="ctrl-label">Threshold <span class="val" id="threshold-v">128</span></div>
    <input type="range" id="threshold" min="1" max="254" value="128" step="1">
  </div>

  <div class="ctrl">
    <div class="ctrl-label">Resolution <span class="val" id="resolution-v">16</span></div>
    <input type="range" id="resolution" min="3" max="48" value="16" step="1">
  </div>

  <div class="divider"></div>

  <button id="export-btn">Export PNG</button>

  <div id="hint">darkest cell &rarr; 8&times;8 split &nbsp;&middot;&nbsp; lightest &rarr; 1&times;1</div>
</aside>

<script src="sketch.js?v=1"></script>
</body>
</html>
